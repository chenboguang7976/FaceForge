version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: monthly
    # Requirements use open ">=" ranges, so pip already installs the newest
    # release; only propose a change when a new release falls outside a range.
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
    ignore:
      # cuda12.txt pins the last CUDA 12 line on purpose (GTX 10xx support);
      # moving it must be a deliberate decision, not an automatic bump.
      - dependency-name: onnxruntime-gpu
