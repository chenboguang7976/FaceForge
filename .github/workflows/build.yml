name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: pip install -r requirements/cpu.txt -r requirements/build.txt
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tuned for low-end Windows laptops (e.g. GTX 1050 4 GB): DirectML runs on
          # NVIDIA, AMD and Intel GPUs without installing CUDA.
          - name: FaceForge-Lite-Windows-x64
            os: windows-2022
            edition: lite
            backend: directml
          # Quality-first builds for strong machines.
          - name: FaceForge-Pro-Windows-x64-CUDA
            os: windows-2022
            edition: pro
            backend: cuda
          - name: FaceForge-Pro-macOS-AppleSilicon
            os: macos-latest
            edition: pro
            backend: cpu
          - name: FaceForge-Pro-Linux-x64-CUDA
            os: ubuntu-22.04
            edition: pro
            backend: cuda
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      FACEFORGE_EDITION: ${{ matrix.edition }}
      FACEFORGE_BACKEND: ${{ matrix.backend }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Free disk space (CUDA builds)
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install dependencies
        run: pip install -r requirements/${{ matrix.backend }}.txt -r requirements/build.txt

      - name: Build
        run: |
          python packaging/make_icon.py
          pyinstaller packaging/faceforge.spec --noconfirm

      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = if ($env:FACEFORGE_EDITION -eq 'lite') { 'FaceForge Lite' } else { 'FaceForge Pro' }
          $env:FACEFORGE_HOME = "$env:RUNNER_TEMP\ff-home"
          $p = Start-Process -FilePath "dist\$name\$name.exe" -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:FACEFORGE_HOME\logs\faceforge.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Selftest failed with exit code $($p.ExitCode)" }

      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        run: |
          FACEFORGE_HOME="$RUNNER_TEMP/ff-home" "dist/FaceForge Pro.app/Contents/MacOS/FaceForge Pro" --selftest

      - name: Selftest (Linux)
        if: runner.os == 'Linux'
        run: |
          FACEFORGE_HOME="$RUNNER_TEMP/ff-home" "dist/FaceForge Pro/FaceForge Pro" --selftest

      # GitHub release assets must be < 2 GB, and the CUDA builds bundle
      # ~2 GB of CUDA/cuDNN libraries: compress hard and split if still too big.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = if ($env:FACEFORGE_EDITION -eq 'lite') { 'FaceForge Lite' } else { 'FaceForge Pro' }
          if ($env:FACEFORGE_BACKEND -eq 'cuda') {
            7z a -t7z -mx=9 -mmt=on -v1900m "${{ matrix.name }}.7z" "./dist/$name"
            if ((Get-ChildItem "${{ matrix.name }}.7z.*").Count -eq 1) {
              Rename-Item "${{ matrix.name }}.7z.001" "${{ matrix.name }}.7z"
            }
          } else {
            7z a -tzip -mx=5 "${{ matrix.name }}.zip" "./dist/$name"
          }
          Get-ChildItem "${{ matrix.name }}.*" | Format-Table Name, Length

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg && cp -R "dist/FaceForge Pro.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "FaceForge Pro" -srcfolder dmg -ov -format UDZO "${{ matrix.name }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          XZ_OPT="-9 -T0" tar -C dist -cJf "${{ matrix.name }}.tar.xz" "FaceForge Pro"
          if [ "$(stat -c %s "${{ matrix.name }}.tar.xz")" -gt 1992294400 ]; then
            split -b 1900m -d -a 3 "${{ matrix.name }}.tar.xz" "${{ matrix.name }}.tar.xz."
            rm "${{ matrix.name }}.tar.xz"
          fi
          ls -la "${{ matrix.name }}".*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*
          compression-level: 0  # already compressed
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
