name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: pip install -r requirements/cpu.txt -r requirements/build.txt
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tuned for low-end Windows laptops (e.g. GTX 1050 4 GB): DirectML runs on
          # NVIDIA, AMD and Intel GPUs without installing CUDA.
          - name: FaceForge-Lite-Windows-x64
            os: windows-2022
            edition: lite
            backend: directml
          # Quality-first builds for strong machines.
          - name: FaceForge-Pro-Windows-x64-CUDA
            os: windows-2022
            edition: pro
            backend: cuda
          - name: FaceForge-Pro-macOS-AppleSilicon
            os: macos-14
            edition: pro
            backend: cpu
          - name: FaceForge-Pro-Linux-x64-CUDA
            os: ubuntu-22.04
            edition: pro
            backend: cuda
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      FACEFORGE_EDITION: ${{ matrix.edition }}
      FACEFORGE_BACKEND: ${{ matrix.backend }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Free disk space (CUDA builds)
        if: runner.os == 'Linux' && matrix.backend == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install dependencies
        run: pip install -r requirements/${{ matrix.backend }}.txt -r requirements/build.txt

      - name: Build
        run: |
          python packaging/make_icon.py
          pyinstaller packaging/faceforge.spec --noconfirm

      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = if ($env:FACEFORGE_EDITION -eq 'lite') { 'FaceForge Lite' } else { 'FaceForge Pro' }
          $env:FACEFORGE_HOME = "$env:RUNNER_TEMP\ff-home"
          $p = Start-Process -FilePath "dist\$name\$name.exe" -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:FACEFORGE_HOME\logs\faceforge.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Selftest failed with exit code $($p.ExitCode)" }

      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        run: |
          FACEFORGE_HOME="$RUNNER_TEMP/ff-home" "dist/FaceForge Pro.app/Contents/MacOS/FaceForge Pro" --selftest

      - name: Selftest (Linux)
        if: runner.os == 'Linux'
        run: |
          FACEFORGE_HOME="$RUNNER_TEMP/ff-home" "dist/FaceForge Pro/FaceForge Pro" --selftest

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = if ($env:FACEFORGE_EDITION -eq 'lite') { 'FaceForge Lite' } else { 'FaceForge Pro' }
          7z a -tzip -mx=5 "${{ matrix.name }}.zip" "./dist/$name"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg && cp -R "dist/FaceForge Pro.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "FaceForge Pro" -srcfolder dmg -ov -format UDZO "${{ matrix.name }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.name }}.tar.gz" "FaceForge Pro"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.dmg
            ${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
